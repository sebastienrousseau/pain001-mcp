[tool.poetry]
name = "pain001-mcp"
version = "0.0.70"
description = "Model Context Protocol (MCP) server exposing the pain001 ISO 20022 Customer Credit Transfer Initiation library as agent tools."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/pain001-mcp"
homepage = "https://pain001.com"
keywords = [
    "iso20022", "pain.001", "pain.008", "sepa", "payments", "mcp",
    "model-context-protocol", "iban", "bic", "mt101", "camt.053", "pain.002",
]
packages = [
    { include = "pain001_mcp" },
]

[tool.poetry.scripts]
pain001-mcp = "pain001_mcp.server:main"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pain001 = {version = ">=0.0.70", extras = ["fast"]}
pain001-loader-mt101 = ">=0.0.1"
mcp = ">=1.2,<3"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
pytest-benchmark = ">=5.0.0,<6.0.0"
black = "^26.3.1"
ruff = ">=0.1,<0.17"
mypy = ">=1.11,<3.0"
types-jsonschema = ">=4,<5"
bandit = "^1.7.0"
interrogate = "^1.7.0"
mutmut = "^3.7.0"
# tests/test_suite_conformance.py parses pyproject.toml. tomllib is
# stdlib only from 3.11 and the suite floor is 3.10, so without the
# backport the conformance gate does not run there at all.
tomli = { version = ">=2", python = "<3.11" }
packaging = ">=23"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# tests/test_suite_conformance.py is generated and vendored from one
# canonical copy shared across the suite, and checksummed by its own
# test. The suite uses three different line lengths, so letting each
# repository's formatter rewrite it would make the checksum
# unsatisfiable everywhere.
[tool.black]
extend-exclude = "tests/test_suite_conformance\\.py"
line-length = 79
target-version = ['py310']

[tool.pytest.ini_options]
markers = [
    "benchmark: performance measurement or scaling guard",
]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=pain001_mcp",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["pain001_mcp"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "@overload",
]
fail_under = 100
show_missing = true
skip_covered = false

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-semiprivate = false
ignore-private = false
ignore-magic = true
exclude = ["tests", "examples"]

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["*.md", "tmp_env", ".venv", ".eggs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A standalone benchmark has to put the repository on sys.path
# before importing the package it measures, so its imports cannot
# come first.
"benches/*.py" = ["E402"]
"__init__.py" = ["F401"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
exclude = [
    "tmp_env/",
    ".venv/",
    ".eggs/",
]

# The MCP server object comes from _mcp_compat, which returns either
# mcp 2.x's MCPServer or mcp 1.x's FastMCP and is therefore typed Any,
# so @server.tool()/@server.resource() read as untyped decorators. The
# decorated functions themselves are fully annotated.
[[tool.mypy.overrides]]
module = "pain001_mcp.server"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pain001.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pain001_loader_mt101.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The tools mirror the (untyped) pain001 public API verbatim, returning
# bare dict/list/str. Relax the two strict checks that signature would trip
# (generic dict/list args and Any propagated from the library) while keeping
# the rest of strict mode in force.
module = "pain001_mcp.*"
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "return-value", "attr-defined", "assignment"]

[tool.mutmut]
# Mutation testing (mutmut 3): every tool handler is mutated and each
# mutant must be caught by the fast tests. Benchmarks, the stdio
# end-to-end run and the suite conformance file are excluded from the
# selection because they do not test handler logic and dominate runtime.
source_paths = ["pain001_mcp"]
# The examples are executed by a test, so they must exist in mutmut's
# working copy beside the tests.
also_copy = ["examples"]
# The SDK-compat shim branches on the installed MCP SDK version; the
# branches for other versions cannot be reached on one install, so its
# surviving mutants say nothing about the tests. Handlers only.
# _cli.py is argparse wiring: flag names, defaults and help prose. Its
# tests pin the flags and defaults; a mutant of a help sentence or a
# parser description is not a bug a test should have to name. The
# transport dispatch it drives, _transports.run, is mutated.
do_not_mutate = ["pain001_mcp/_mcp_compat.py", "pain001_mcp/_cli.py"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider", "--no-cov", "--benchmark-disable"]
pytest_add_cli_args_test_selection = [
    "tests/test_mcp_server.py",
    "tests/test_corpus_tools.py",
    "tests/test_llm_ergonomics.py",
    "tests/test_mcp_sdk_compat.py",
    "tests/test_tool_result_shapes.py",
    "tests/test_structured_output.py",
    "tests/test_transports.py",
]
