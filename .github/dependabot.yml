version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "sebastienrousseau"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "python"
      # pain001 and suite members are hand-bumped in lockstep with the suite;
      # Dependabot would otherwise propose patch bumps that don't align with our
      # version-for-version release policy.
      - dependency-name: "pain001"
      - dependency-name: "pain001-loader-mt101"
      # Build tooling / standalone CLI tools not managed as direct pip dependencies
      - dependency-name: "poetry"
      - dependency-name: "cyclonedx-bom"


  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "sebastienrousseau"
    labels:
      - "ci/cd"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "sebastienrousseau"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
