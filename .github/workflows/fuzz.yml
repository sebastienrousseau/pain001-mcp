name: Fuzz

# Coverage-guided fuzzing of the text-taking MCP tools with Atheris
# (fuzz/fuzz_tools.py). A short run on every change; a longer one weekly.
# A crash fails the job and the reproducer is uploaded.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:30 UTC.
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  atheris:
    name: Atheris (text-taking tools)
    # Atheris ships Linux x86_64 wheels only; fuzz.txt is compiled for it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install fuzz toolchain and this package
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: scripts/ci-install.sh requirements/fuzz.txt

      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '120' }}
        run: |
          mkdir -p crashes
          python fuzz/fuzz_tools.py \
            -max_total_time="$FUZZ_SECONDS" \
            -artifact_prefix=crashes/

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: crashes/
