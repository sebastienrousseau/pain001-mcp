name: Nightly Quality

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly check + coverage upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pain001 + this package + dev tools
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          python -m pip install --upgrade pip
          if [[ "$REF" == main || "$REF" == feat/* || "$REF" == fix/* ]] && \
             git ls-remote --exit-code --heads \
               https://github.com/sebastienrousseau/pain001 "$REF" >/dev/null 2>&1; then
            pip install "pain001 @ git+https://github.com/sebastienrousseau/pain001@${REF}"
          else
            pip install "pain001>=0.0.54,<0.0.55"
          fi
          pip install -e .
          pip install pytest pytest-cov pytest-benchmark interrogate ruff black mypy bandit pip-audit types-jsonschema

      - name: Full gate (lint + type + tests + interrogate + bandit + audit)
        run: |
          ruff check pain001_mcp/ tests/
          black --check pain001_mcp/ tests/ benches/
          mypy pain001_mcp/
          pytest tests/ --cov=pain001_mcp --cov-branch --cov-report=xml --cov-fail-under=100
          # Not a timing gate -- wall-clock is not comparable between
          # runners. This proves the benchmark still runs against the
          # current API rather than rotting into a file that reads as
          # verified and is not.
          python benches/bench_generate.py --quick
          interrogate -c pyproject.toml pain001_mcp
          bandit -r pain001_mcp/ -ll
          pip-audit
