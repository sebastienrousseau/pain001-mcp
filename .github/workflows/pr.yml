name: PR Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: PR sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pain001 + this package + dev tools
        env:
          # Untrusted input (a fork's branch name) passed through the
          # environment, never interpolated into the script.
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          python -m pip install --upgrade pip
          if [[ "$REF" == main || "$REF" == feat/* || "$REF" == fix/* ]] && \
             git ls-remote --exit-code --heads \
               https://github.com/sebastienrousseau/pain001 "$REF" >/dev/null 2>&1; then
            pip install "pain001 @ git+https://github.com/sebastienrousseau/pain001@${REF}"
          else
            pip install "pain001>=0.0.54,<0.0.55"
          fi
          pip install -e .
          pip install pytest pytest-cov pytest-benchmark interrogate ruff black mypy types-jsonschema

      - name: Lint
        run: |
          ruff check pain001_mcp/ tests/
          black --check pain001_mcp/ tests/ benches/

      - name: Type check
        run: mypy pain001_mcp/

      - name: Tests with 100% coverage gate
        run: |
          pytest tests/ \
            --cov=pain001_mcp --cov-branch \
            --cov-report=xml --cov-report=term \
            --cov-fail-under=100

      - name: Docstring coverage
        run: interrogate -c pyproject.toml pain001_mcp

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
