name: Publish to MCP Registry

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.0.71). Defaults to version in server.json"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish-mcp:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve publish version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(jq -r '.version' server.json)
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Validate server.json description length
        run: |
          DESC_LEN=$(jq -r '.description | length' server.json)
          if [ "$DESC_LEN" -gt 100 ]; then
            echo "::error::server.json description length ($DESC_LEN) exceeds 100 characters"
            exit 1
          fi

      # The MCP Registry validates PyPI ownership by fetching the
      # PyPI JSON API and matching the `mcp-name:` marker in the
      # README. release.yml (which publishes to PyPI) runs in
      # parallel with this workflow on the same tag, so we must
      # wait for PyPI to surface the new version before calling
      # mcp-publisher; otherwise the first-time publish 404s on
      # ownership verification.
      - name: Wait for PyPI to surface this version
        run: |
          PKG="pain001-mcp"
          for i in $(seq 1 60); do
            if curl -sfo /dev/null "https://pypi.org/pypi/${PKG}/${VERSION}/json"; then
              echo "PyPI surfaced ${PKG}==${VERSION} after $((i * 5))s"
              exit 0
            fi
            echo "Waiting for PyPI to surface ${PKG}==${VERSION} (attempt ${i}/60)…"
            sleep 5
          done
          echo "::error::PyPI did not surface ${PKG}==${VERSION} within 5 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      # Retry the publish itself rather than trying to predict when the
      # registry will be able to see the release.
      #
      # There are already two "wait for PyPI" steps above, and v0.0.61
      # still failed: both polled PyPI's JSON API, which served the new
      # version immediately ("visible on PyPI (attempt 1)"), while the
      # registry's own lookup still 404'd for another few minutes. The
      # JSON API is simply not a proxy for what the registry sees, so no
      # amount of polling it makes this reliable.
      #
      # Retrying the operation that has to succeed does. A manual re-run
      # of this job, unchanged, has been what fixed it every time.
      - name: Publish to MCP Registry
        run: |
          set -uo pipefail
          for attempt in $(seq 1 10); do
            if ./mcp-publisher publish; then
              echo "Published on attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying in 30s"
            sleep 30
          done
          echo "::error::mcp-publisher still failing after 10 attempts (5 minutes)"
          exit 1
