# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Markdown style on every push and pull request (markdownlint-cli2,
# configured in .markdownlint-cli2.jsonc). Run it locally with
# `npx markdownlint-cli2@0.23.3 "**/*.md"`.
name: Docs lint

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Markdown style (markdownlint-cli2)
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"
