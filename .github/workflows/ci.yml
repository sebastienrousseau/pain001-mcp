name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # release.yml runs `poetry install --only main`, but nothing else here
  # uses poetry — CI installs with pip. So a poetry.lock that no longer
  # matches pyproject.toml stays invisible until a release, and the tag
  # has already been pushed by then. That is exactly how v0.0.61 failed:
  #
  #   pyproject.toml changed significantly since poetry.lock was last
  #   generated. Run `poetry lock` to fix the lock file.
  #
  # Cheap job, runs on every PR, fails in seconds instead of at a tag.
  lockfile:
    name: Lockfile matches pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Verify poetry.lock is current
        run: |
          if ! poetry check --lock; then
            echo "::error::poetry.lock is stale. Run 'poetry lock' and commit the result."
            exit 1
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # pain001-mcp depends on the core pain001 library, which is not yet
      # published to PyPI. Install it from its GitHub repository first,
      # then install this package and its dev dependencies on top.
      - name: Install pain001 (from PyPI) + this package
        run: |
          python -m pip install --upgrade pip
          REF="${{ github.head_ref || github.ref_name }}"
          # Use a matching parent-lib branch for coordinated changes, but
          # fall back to the pinned release when no such branch exists so a
          # standalone feat/* PR isn't blocked by a phantom parent branch.
          if [[ "$REF" == feat/* || "$REF" == fix/* ]] && \
             git ls-remote --exit-code --heads \
               https://github.com/sebastienrousseau/pain001 "$REF" >/dev/null 2>&1; then
            pip install "pain001 @ git+https://github.com/sebastienrousseau/pain001@${REF}"
          else
            pip install "pain001>=0.0.54,<0.0.55"
          fi
          pip install -e .
          pip install pytest pytest-cov pytest-benchmark interrogate

      - name: Run tests with the 100% coverage gate
        run: |
          pytest tests/ \
            --cov=pain001_mcp --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100 -v

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml pain001_mcp

      # The scaling guards compare each tool against itself at two batch
      # sizes, so they do not depend on how fast this runner is.
      - name: Benchmarks and scaling guards
        run: |
          mkdir -p .benchmarks
          pytest tests/test_benchmarks.py -v --no-cov \
            --benchmark-json=.benchmarks/results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-py${{ matrix.python-version }}
          path: .benchmarks/

      - name: Upload coverage XML
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pain001 (from PyPI) + this package
        run: |
          python -m pip install --upgrade pip
          REF="${{ github.head_ref || github.ref_name }}"
          # Use a matching parent-lib branch for coordinated changes, but
          # fall back to the pinned release when no such branch exists so a
          # standalone feat/* PR isn't blocked by a phantom parent branch.
          if [[ "$REF" == feat/* || "$REF" == fix/* ]] && \
             git ls-remote --exit-code --heads \
               https://github.com/sebastienrousseau/pain001 "$REF" >/dev/null 2>&1; then
            pip install "pain001 @ git+https://github.com/sebastienrousseau/pain001@${REF}"
          else
            pip install "pain001>=0.0.54,<0.0.55"
          fi
          pip install -e .
          pip install ruff black mypy types-jsonschema

      - name: Ruff check
        run: ruff check pain001_mcp/ tests/

      - name: Black check
        run: black --check pain001_mcp/ tests/ benches/

      - name: Mypy
        run: mypy pain001_mcp/

  examples:
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pain001 (from PyPI) + this package
        run: |
          python -m pip install --upgrade pip
          REF="${{ github.head_ref || github.ref_name }}"
          # Use a matching parent-lib branch for coordinated changes, but
          # fall back to the pinned release when no such branch exists so a
          # standalone feat/* PR isn't blocked by a phantom parent branch.
          if [[ "$REF" == feat/* || "$REF" == fix/* ]] && \
             git ls-remote --exit-code --heads \
               https://github.com/sebastienrousseau/pain001 "$REF" >/dev/null 2>&1; then
            pip install "pain001 @ git+https://github.com/sebastienrousseau/pain001@${REF}"
          else
            pip install "pain001>=0.0.54,<0.0.55"
          fi
          pip install -e .

      - name: Run examples
        run: |
          python examples/01_mcp_tools.py
          python examples/02_validate_pipeline.py
          python examples/03_parse_bank_replies.py
